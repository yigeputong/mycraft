plugins {
    id 'com.android.application'
}

// 默认使用 CMake 构建
def buildWithCMake = true

def vcpkgRoot = System.getenv("VCPKG_ROOT") ?: "/path/to/your/vcpkg" 
// 转换为正斜杠，防止 CMake 路径解析错误
vcpkgRoot = vcpkgRoot.replace("\\", "/")

// 在 android 块外，根据当前注入的 ABI 动态决定 triplet
def currentAbi = project.findProperty("android.injected.build.abi") ?: "arm64-v8a"
def targetTriplet = "arm64-android"
if (currentAbi == "x86_64") {
    targetTriplet = "x64-android"
} else if (currentAbi == "armeabi-v7a") {
    targetTriplet = "arm-android"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.yigeputong.mycraft"
    compileSdkVersion 35

    ndkVersion = "30.0.16248370"

    defaultConfig {
        applicationId "com.yigeputong.mycraft"

        minSdkVersion 28
        targetSdkVersion 35
        versionCode 3
        versionName "0.3.0"

        ndk {
           abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                        "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                        "-DVCPKG_TARGET_TRIPLET=${targetTriplet}",
                        "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake"
                
                cppFlags "-std=c++23 -fexceptions -frtti"
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 替换为官方推荐的新版规则文件
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }

        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path '../../CMakeLists.txt'
                    version "3.22.1"
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../mycraft/assets']
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}